name: Production Build and Deploy

# Expects these secrets to be configured in your GitHub repo:
# - CLOUDFLARE_API_TOKEN
# - CLOUDFLARE_ACCOUNT_ID

on:
  # schedule: # Run at 15:00 UTC every day --- enable if you want to do something like scheduled blog posts
  #   - cron: "0 15 * * *"
  push: # Run on pushes to main
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'design-docs/**'
  workflow_dispatch: # Allows running this workflow manually

jobs:
  build-and-deploy:
    if: github.repository == 'tylermercer/durable-objects-webgame-starter' # repo check prevents failure before init; remove on init
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        id: checkout_repo
        uses: actions/checkout@v4
        with:
          # you can omit this token for public repositories, which can be accessed without a personal access token
          token: ${{ github.token }}
          # clone the utils submodule. You can remove this if you bring the utils files into your repo, or if you don't use those files.
          submodules: recursive

      - name: Cache assets
        uses: actions/cache@v3
        with:
          path: | # .cache is for any user-land caching. E.g. in some of my projects I cache rendered OG images
            .cache
            node_modules/.astro
          key: assets-${{ github.run_id }} # Save each run's cache
          restore-keys: | # Restore most recent cache
            assets-

      - name: Cache pnpm store
        uses: actions/cache@v3
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Build site
        id: build_site
        env:
          PUBLIC_COMMIT_HASH: ${{ github.sha }}
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build

      - name: Deploy to Cloudflare Production
        id: deploy-main
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
